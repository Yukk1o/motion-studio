[package]
name = "aem-host"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Platform-neutral editing host shared by the Android and desktop applications"

[lib]
crate-type = ["rlib"]

[features]
default = []

[dependencies]
aem-effects = { path = "../aem-effects" }
aem-core = { path = "../aem-core" }
aem-render = { path = "../aem-render" }
aem-media = { path = "../aem-media" }
serde.workspace = true
serde_json.workspace = true
pollster.workspace = true
wgpu.workspace = true
image.workspace = true
bytemuck.workspace = true
raw-window-handle = "0.6"