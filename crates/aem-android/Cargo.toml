[package]
name = "aem-android"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Android JNI adapter over the shared editing host"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = []
diagnostics = []

[dependencies]
aem-host = { path = "../aem-host" }
aem-effects = { path = "../aem-effects" }
aem-core = { path = "../aem-core" }
aem-render = { path = "../aem-render" }
aem-media = { path = "../aem-media" }
serde_json.workspace = true
wgpu.workspace = true

[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"
ndk = { version = "0.9", features = ["media", "api-level-29"] }
ndk-sys = { version = "0.6", features = ["media"] }
libc = "0.2"