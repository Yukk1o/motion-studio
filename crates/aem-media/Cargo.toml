[package]
name = "aem-media"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
image.workspace = true
aem-core = { path = "../aem-core" }
serde.workspace = true
serde_json.workspace = true
fs2 = "0.4.3"
symphonia = { version = "=0.5.5", default-features = false, features = ["aac", "mp3", "isomp4", "wav", "pcm", "flac", "alac", "vorbis", "ogg", "aiff"] }

[dev-dependencies]
zip = { version = "2.4", default-features = false, features = ["deflate"] }
tempfile = "3"
